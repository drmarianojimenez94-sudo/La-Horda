# LA HORDA — servidor del juego (server/relay.js) en Render: salas multijugador + cuentas de usuario.
# Render lo lee solo al crear un "Blueprint" desde este repositorio (ver docs/MULTIPLAYER_B1.md y
# docs/ACCOUNTS_DEPLOY.md). No contiene secretos.
services:
  - type: web
    name: la-horda-relay
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node relay.js
    healthCheckPath: /health
    envVars:
      # desde qué páginas se puede usar el servidor: la Alpha principal (fondalstudios.com), el juego en
      # GitHub Pages y sus previews
      - key: ALLOWED_ORIGINS
        value: https://fondalstudios.com,https://drmarianojimenez94-sudo.github.io,https://rawcdn.githack.com,https://raw.githack.com
      # CUENTAS: dirección de la base de datos Postgres (Neon, Supabase o Render Postgres). Es un
      # secreto: NO va escrita acá. "sync: false" hace que Render la pida al crear el Blueprint; en un
      # servicio que ya existe se pega a mano en Environment (paso a paso en docs/ACCOUNTS_DEPLOY.md).
      # Sin esto el juego anda igual, pero las cuentas se borran cada vez que el servidor se duerme.
      - key: DATABASE_URL
        sync: false
