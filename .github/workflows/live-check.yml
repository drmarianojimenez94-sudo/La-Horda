# LA HORDA — verificación del juego PUBLICADO (no del código local):
#   relay:  el servidor de salas de Render se despierta, A crea una sala y B se une con el código.
#   phones: dos iPhone emulados abren el juego de GitHub Pages y hacen el flujo real de la Sala
#           (crear, unirse con código, sala llena, enlace de invitación) contra el relay publicado.
#   load:   carga del juego publicado con 4G simulado (tiempo hasta "Toca para continuar").
# Se corre a mano (Actions → "Live check" → Run workflow) o sola cada día.
name: Live check
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/live-check.yml", "tools/net-test/live_relay.js"]
  schedule:
    - cron: "17 11 * * *"
permissions:
  contents: read
env:
  RELAY: wss://la-horda-relay.onrender.com
  SITE: https://drmarianojimenez94-sudo.github.io/La-Horda
  ORIGIN: https://drmarianojimenez94-sudo.github.io
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix server --no-audit --no-fund
      - run: node tools/net-test/live_relay.js
  phones:
    needs: relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix server --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/net-test/lobby_code_skins.js mobile shots
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: phones-shots, path: shots, if-no-files-found: ignore }
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - run: SE_BASE_URL="$SITE" node tools/audit/loadtime.js load-out
